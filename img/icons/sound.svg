      <path d="M64 22 C72 30 72 38 64 46" stroke-width="4.5"/>
      <path d="M74 14 C86 26 86 42 74 54" stroke-width="4.5"/>
      <path d="M84 6 C100 22 100 46 84 62" stroke-width="4.5"/>
