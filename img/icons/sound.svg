    <!-- white outline shell -->
    <path d="M6 18
             H28
             L46 6
             H58
             V58
             H46
             L28 46
             H6
             C3 46 2 43 2 40
             V24
             C2 21 3 18 6 18 Z"
          fill="#f5f5f7"/>
    <!-- dark fill -->
    <path d="M8 22
             H29
             L45 12
             H54
             V52
             H45
             L29 42
             H8
             C6 42 5 40 5 38
             V26
             C5 24 6 22 8 22 Z"
