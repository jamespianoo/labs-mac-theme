<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- shadow -->
  <ellipse cx="72" cy="120" rx="34" ry="5" fill="rgba(0,0,0,0.32)" shape-rendering="auto"/>

  <!-- top depth strip (all coords on 4px grid) -->
  <polygon points="24,24 80,24 88,16 32,16" fill="#c8c8c4"/>
  <!-- right depth strip -->
  <polygon points="88,40 96,32 96,112 88,112" fill="#a0a09c"/>
  <!-- top-right corner join -->
  <polygon points="80,24 88,16 96,32 88,40" fill="#b4b4b0"/>

  <!-- main paper face — pixel-art staircase dog ear (2 steps of 4px) -->
  <polygon points="24,24 80,24 84,24 84,32 88,32 88,40 88,112 24,112" fill="#f6f5f0"/>
  <!-- dog ear fold -->
  <polygon points="80,24 84,24 84,32 88,32 88,40 80,40" fill="#d4d3cc"/>

  <!-- depth outlines -->
  <line x1="24" y1="24" x2="32" y2="16" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="32" y1="16" x2="88" y2="16" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="88" y1="16" x2="96" y2="32" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="96" y1="32" x2="96" y2="112" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="96" y1="112" x2="88" y2="112" stroke="#2a2a2a" stroke-width="2"/>

  <!-- main face outline (staircase dog ear) -->
  <polyline points="24,24 80,24 84,24 84,32 88,32 88,112 24,112 24,24" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <!-- fold inner crease -->
  <polyline points="80,24 80,40 88,40" fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <!-- text lines on 4px grid -->
  <rect x="32" y="52" width="44" height="4" fill="#c4c2ba"/>
  <rect x="32" y="64" width="44" height="4" fill="#c4c2ba"/>
  <rect x="32" y="76" width="44" height="4" fill="#c4c2ba"/>
  <rect x="32" y="88" width="28" height="4" fill="#c4c2ba"/>
</svg>
